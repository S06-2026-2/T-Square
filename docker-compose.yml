services:
  db:
    image: postgres:16-alpine
    container_name: gesso_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gesso}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gesso}
      POSTGRES_DB: ${POSTGRES_DB:-gesso}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gesso} -d ${POSTGRES_DB:-gesso}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: gesso_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gesso}:${POSTGRES_PASSWORD:-gesso}@db:5432/${POSTGRES_DB:-gesso}?schema=public
      JWT_SECRET: ${JWT_SECRET:-troque-esse-segredo-em-producao}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-5-5}
      AGENTE_AUTOMATICO: ${AGENTE_AUTOMATICO:-false}
    ports:
      - "3000:3000"
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run start:dev"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: gesso_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  db_data:
